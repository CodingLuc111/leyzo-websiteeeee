<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYROTV</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      color: white;
      background: url("logo.jpg") no-repeat center center/cover;
    }

    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      top: 0;
      left: 0;
      z-index: 0;
    }

    nav {
      position: absolute;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 2;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
    }

    .logo {
      font-size: 22px;
      letter-spacing: 3px;
    }

    .links a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      opacity: 0.7;
      transition: 0.3s;
    }

    .links a:hover {
      opacity: 1;
      text-shadow: 0 0 10px #4da3ff;
    }

    .hero {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      z-index: 2;
      position: relative;
      animation: fadeUp 2s ease forwards;
    }

    .title {
      font-size: 70px;
      letter-spacing: 12px;
      animation: glow 3s ease-in-out infinite alternate;
    }

    .line {
      width: 120px;
      height: 3px;
      background: #4da3ff;
      margin: 20px auto;
      box-shadow: 0 0 20px #4da3ff;
      animation: pulse 2s infinite;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      border: 1px solid #4da3ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .buttons a:hover {
      background: #4da3ff;
      box-shadow: 0 0 20px #4da3ff;
      transform: translateY(-3px);
    }

    /* Animationen */

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #4da3ff;
      }
      to {
        text-shadow: 0 0 30px #4da3ff;
      }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 10px #4da3ff; }
      50% { box-shadow: 0 0 30px #4da3ff; }
      100% { box-shadow: 0 0 10px #4da3ff; }
    }

  </style>
</head>
<body>

  <nav>
    <div class="logo">LYROTV</div>

    <div class="links">
      <a href="https://www.tiktok.com/@lyrotv00" target="_blank">TikTok</a>
      <a href="https://discord.gg/5JsSQKqVDA" target="_blank">Discord</a>
      <a href="https://youtube.com/@lyrotv0" target="_blank">YouTube</a>
      <a href="https://twitch.tv/lyrotv00" target="_blank">Twitch</a>
    </div>
  </nav>

  <div class="hero">
    <div class="title">LYROTV</div>
    <div class="line"></div>

    <div class="buttons">
      <a href="https://www.tiktok.com/@lyrotv00" target="_blank">TikTok</a>
      <a href="https://discord.gg/5JsSQKqVDA" target="_blank">Discord</a>
      <a href="https://youtube.com/@lyrotv0" target="_blank">YouTube</a>
      <a href="https://twitch.tv/lyrotv00" target="_blank">Twitch</a>
    </div>
  </div>

</body>
</html>
